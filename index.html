    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ShopHub",
      "url": "https://shopshub.lovable.app",
      "logo": "https://storage.googleapis.com/gpt-engineer-file-uploads/DfL2Um3y3XXZxZX3OJNHS6nialn2/uploads/1762347464228-ChatGPT Image Nov 5, 2025, 06_25_51 PM.png",

        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://shopshub.lovable.app/contact"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShopHub",
      "url": "https://shopshub.lovable.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://shopshub.lovable.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: Online Store -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "ShopHub",
      "url": "https://shopshub.lovable.app",
      "description": "Online shopping for electronics, clothing, home essentials, and more with fast delivery and secure payments.",
      "priceRange": "₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "UPI, Credit Card, Debit Card, Net Banking",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "ShopHub Products",
        "itemListElement": [
          { "@type": "OfferCatalog", "name": "Electronics" },
          { "@type": "OfferCatalog", "name": "Clothing" },
          { "@type": "OfferCatalog", "name": "Home & Kitchen" },
          { "@type": "OfferCatalog", "name": "Books" },
          { "@type": "OfferCatalog", "name": "Sports" },
          { "@type": "OfferCatalog", "name": "Beauty" }
        ]
      }
    }
